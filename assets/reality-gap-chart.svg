<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Mono', Menlo, Consolas, monospace" role="img" aria-label="Reality-Gap Eval: 9 of 12 ungated sessions ended with the app broken (all honestly reported); 12 of 12 Paranoid sessions ended with the check passing, at +7.5 turns and +$0.22 per session">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#0e1422"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7b733"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- broken = red + 45° hatch so state never rides on hue alone (CVD/print) -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f85149"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#0b0e14" stroke-width="2.5" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="540" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="539" rx="18" fill="none" stroke="#1c2430" stroke-width="1"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#amber)"/>

  <!-- header -->
  <text x="60" y="64" fill="#f7b733" font-size="14" font-weight="600" letter-spacing="3">REALITY-GAP&#160;EVAL&#160;&#160;·&#160;&#160;24&#160;SESSIONS&#160;&#160;·&#160;&#160;CLAUDE-SONNET-5</text>
  <text x="60" y="104" fill="#eef2f9" font-size="28" font-weight="700">How sessions ended: ungated vs Paranoid</text>
  <text x="60" y="134" fill="#aab4c2" font-size="16">4 green-tests/broken-app tasks &#215; 3 runs &#215; 2 arms &#160;·&#160; oracle = each task&#8217;s committed acceptance check</text>

  <!-- bar 1: ungated baseline -->
  <text x="60" y="196" fill="#eef2f9" font-size="18" font-weight="700">ungated (baseline)</text>
  <g>
    <rect x="60" y="210" width="809" height="48" rx="5" fill="url(#hatch)"/>
    <rect x="871" y="210" width="269" height="48" rx="5" fill="#3fb950"/>
    <text x="82" y="240" fill="#0b0e14" font-size="16" font-weight="700">&#10007;&#160;&#160;ended broken &#8212; 9</text>
    <text x="893" y="240" fill="#0b0e14" font-size="16" font-weight="700">&#10003;&#160;&#160;ended working &#8212; 3</text>
  </g>
  <text x="60" y="286" fill="#6f7a8a" font-size="15">all 9 broken endings said <tspan fill="#e6a0a0">VERDICT: BROKEN</tspan> &#8212; reported, not fixed &#160;·&#160; false completion <tspan fill="#e6edf3">0/12</tspan></text>

  <!-- bar 2: paranoid -->
  <text x="60" y="342" fill="#eef2f9" font-size="18" font-weight="700">with Paranoid <tspan fill="#f7b733">(stop-gate)</tspan></text>
  <g>
    <rect x="60" y="356" width="1080" height="48" rx="5" fill="#3fb950"/>
    <text x="82" y="386" fill="#0b0e14" font-size="16" font-weight="700">&#10003;&#160;&#160;ended working (acceptance check passed) &#8212; 12</text>
  </g>
  <text x="60" y="432" fill="#6f7a8a" font-size="15">9 blocked-then-fixed recoveries &#160;·&#160; gate cost: <tspan fill="#e6edf3">+7.5 turns, +$0.22 per session</tspan> (mean)</text>

  <!-- legend -->
  <g transform="translate(60,462)">
    <rect x="0" y="0" width="22" height="14" rx="3" fill="url(#hatch)"/>
    <text x="32" y="12" fill="#aab4c2" font-size="14">&#10007; session ended with the check still failing</text>
    <rect x="420" y="0" width="22" height="14" rx="3" fill="#3fb950"/>
    <text x="452" y="12" fill="#aab4c2" font-size="14">&#10003; session ended with the check passing</text>
  </g>

  <text x="60" y="512" fill="#6f7a8a" font-size="14">pre-registered design: eval/PREREGISTER.md &#160;·&#160; full data, nothing dropped: eval/results/results.jsonl</text>
</svg>
