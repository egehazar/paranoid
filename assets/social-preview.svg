<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Consolas, 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#0e1422"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="60%">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7b733"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#amber)"/>

  <!-- eyebrow -->
  <text x="640" y="150" text-anchor="middle" fill="#f7b733" font-size="24" font-weight="700" letter-spacing="8">CLAUDE&#160;CODE&#160;PLUGIN</text>

  <!-- wordmark -->
  <text x="640" y="300" text-anchor="middle" fill="#eef2f9" font-size="150" font-weight="800" letter-spacing="4">PARANOID</text>

  <!-- tagline -->
  <text x="640" y="368" text-anchor="middle" fill="#aab4c2" font-size="34" font-weight="500">Tests passed. But does the feature actually <tspan fill="#f7b733" font-style="italic">run?</tspan></text>

  <!-- thesis chips -->
  <g transform="translate(288,438)">
    <rect x="0" y="0" width="330" height="60" rx="12" fill="#0f1a12" stroke="#1f3a26" stroke-width="1.5"/>
    <text x="26" y="39" fill="#3fb950" font-size="26" font-weight="800">&#10003;</text>
    <text x="58" y="39" fill="#c9d4c2" font-size="24">14 tests passing</text>
  </g>
  <g transform="translate(662,438)">
    <rect x="0" y="0" width="330" height="60" rx="12" fill="#1c1214" stroke="#3a2226" stroke-width="1.5"/>
    <text x="26" y="39" fill="#f85149" font-size="26" font-weight="800">&#10007;</text>
    <text x="58" y="39" fill="#e6c9c9" font-size="24">app returns HTTP 500</text>
  </g>

  <!-- footer -->
  <text x="640" y="576" text-anchor="middle" fill="#6f7a8a" font-size="24">Blocks the agent from finishing until the real-app check passes.</text>
  <text x="640" y="612" text-anchor="middle" fill="#f7b733" font-size="22" font-weight="600" letter-spacing="1">github.com/egehazar/paranoid</text>
</svg>
