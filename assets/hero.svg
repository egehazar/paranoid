<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Mono', Menlo, Consolas, monospace" role="img" aria-label="Paranoid — tests passed, but does the feature actually run?">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#0e1422"/>
    </linearGradient>
    <radialGradient id="glow" cx="26%" cy="38%" r="55%">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7b733"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="420" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="none" stroke="#1c2430" stroke-width="1"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#amber)"/>

  <!-- LEFT: wordmark + thesis -->
  <text x="60" y="92" fill="#f7b733" font-size="15" font-weight="600" letter-spacing="4">CLAUDE&#160;CODE&#160;PLUGIN</text>

  <text x="58" y="182" fill="#eef2f9" font-size="82" font-weight="800" letter-spacing="1">PARANOID</text>
  <rect x="612" y="150" width="18" height="42" fill="url(#amber)"/>

  <text x="60" y="232" fill="#aab4c2" font-size="23" font-weight="500">Tests passed. But does the feature actually <tspan fill="#f7b733" font-style="italic">run?</tspan></text>

  <!-- thesis chips -->
  <g transform="translate(60,266)">
    <rect x="0" y="0" width="470" height="42" rx="8" fill="#0f1a12" stroke="#1f3a26"/>
    <text x="18" y="27" fill="#3fb950" font-size="17" font-weight="700">&#10003;</text>
    <text x="44" y="27" fill="#c9d4c2" font-size="16"><tspan fill="#8b96a5">npm test</tspan>&#160;&#160;&#8594;&#160;&#160;14 passing, 0 failing</text>
  </g>
  <g transform="translate(60,318)">
    <rect x="0" y="0" width="470" height="42" rx="8" fill="#1c1214" stroke="#3a2226"/>
    <text x="18" y="27" fill="#f85149" font-size="17" font-weight="700">&#10007;</text>
    <text x="44" y="27" fill="#e6c9c9" font-size="16"><tspan fill="#8b96a5">GET /api/users/123</tspan>&#160;&#160;&#8594;&#160;&#160;HTTP 500</text>
  </g>

  <text x="60" y="392" fill="#6f7a8a" font-size="15">Same commit. Green tests, broken app — Paranoid is what notices.</text>

  <!-- RIGHT: terminal window with the block report -->
  <g transform="translate(672,54)">
    <rect x="0" y="0" width="474" height="312" rx="12" fill="#0f141d" stroke="#242d3b"/>
    <!-- title bar -->
    <path d="M0 12 A12 12 0 0 1 12 0 H462 A12 12 0 0 1 474 12 V40 H0 Z" fill="#141a24"/>
    <circle cx="22" cy="20" r="5.5" fill="#f85149"/>
    <circle cx="42" cy="20" r="5.5" fill="#f7b733"/>
    <circle cx="62" cy="20" r="5.5" fill="#3fb950"/>
    <text x="237" y="25" fill="#6f7a8a" font-size="13" text-anchor="middle">paranoid&#160;·&#160;stop hook</text>

    <!-- body -->
    <g font-size="15">
      <text x="26" y="82" fill="#f7b733" font-weight="700" letter-spacing="2">PARANOID</text>
      <text x="26" y="104" fill="#2b3442">──────────────────────────────────</text>
      <text x="26" y="132" fill="#e6edf3">Real app check&#160;&#160;<tspan fill="#f85149" font-weight="700">&#10007; failed</tspan> <tspan fill="#6f7a8a">(exit 1)</tspan></text>
      <text x="26" y="156" fill="#6f7a8a">&#160;&#160;node scripts/check-live-app.mjs</text>
      <text x="26" y="190" fill="#e6a0a0">&#160;&#160;GET /api/users/123 &#8594; HTTP 500</text>
      <text x="26" y="214" fill="#6f7a8a">&#160;&#160;formatUser: displayName missing</text>
      <text x="26" y="248" fill="#e6edf3">Tests may be green.</text>
      <text x="26" y="270" fill="#f7b733" font-weight="600">The feature isn&#8217;t.</text>
      <text x="26" y="292" fill="#2b3442">──────────────────────────────────</text>
    </g>
  </g>
</svg>
